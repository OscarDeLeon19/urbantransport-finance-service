# ==================== Base de datos ====================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ==================== Kafka ====================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP}

# ==================== JWT (llave pública de identity) ====================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTITY_JWKS_URI}

# ==================== Comunicación con fleet ====================
app.fleet.base-url=${FLEET_URL}
app.fleet.api-key=${INTERNAL_API_KEY}

# ==================== Observabilidad ====================
management.endpoint.health.show-details=never
logging.level.root=INFO