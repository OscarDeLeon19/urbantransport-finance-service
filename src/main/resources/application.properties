# ===== Aplicación =====
spring.application.name=finance-service
server.port=${SERVER_PORT:8087}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
app.zone=America/Guatemala

# ===== Base de datos =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finance_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Kafka =====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.group-id=finance-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

app.kafka.topic.finance-events=finance-events
app.kafka.topic.trip-events=trip-events

app.jobs.outbox.fixed-delay-ms=2000

# ===== Seguridad =====
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

# ===== fleet-service =====
app.fleet.base-url=${FLEET_URL:http://localhost:8082}
app.fleet.api-key=${INTERNAL_API_KEY:bgrYnhNTQaQVy1sxCjpRorn09NdsI2qFCnMCFVvhJHg=}
app.fleet.connect-timeout=2s
app.fleet.read-timeout=5s
app.fleet.circuit-breaker.sliding-window-size=10
app.fleet.circuit-breaker.minimum-calls=5
app.fleet.circuit-breaker.failure-rate-threshold=50
app.fleet.circuit-breaker.wait-in-open-state=15s

# ===== Observabilidad y documentación =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
